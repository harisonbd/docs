<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181a" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' blob: data:; font-src 'self' data:">
<title>Pocket Docs</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo-192.png">
<link rel="apple-touch-icon" href="logo-192.png">
<style>
  :root {
    --bg: #f6f6f4; --surface: #ffffff; --text: #1c1c1e; --muted: #6b6b70;
    --line: #dcdcd8; --accent: #2f5bd3; --accent-text: #ffffff;
    --danger: #c0352b; --notice-bg: #fff4d6; --notice-text: #5a4300;
    --page-shadow: 0 1px 4px rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181a; --surface: #232326; --text: #ececee; --muted: #a0a0a6;
      --line: #3a3a3e; --accent: #7d9cff; --accent-text: #0e1530;
      --danger: #ff7b70; --notice-bg: #3a3218; --notice-text: #f3dfa2;
      --page-shadow: 0 1px 4px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .view { display: flex; flex-direction: column; height: 100dvh; }
  .view[hidden] { display: none; }
  button {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px;
    min-height: 52px; min-width: 52px; padding: 0 16px; cursor: pointer;
  }
  button:active { filter: brightness(.92); }
  button:disabled { opacity: .4; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }

  .bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line); background: var(--bg);
  }
  .bar h1 { font-size: 26px; margin: 6px 2px; }
  .bar .title { flex: 1; min-width: 0; }
  .bar .title b { display: block; font-size: 19px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .title small { display: block; color: var(--muted); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .actions { display: flex; gap: 12px; padding: 14px; }
  .actions button { flex: 1; min-height: 60px; font-size: 19px; }

  #docList { list-style: none; margin: 0; padding: 0 14px 24px; overflow-y: auto; flex: 1; }
  #docList li { display: flex; gap: 8px; margin-bottom: 10px; }
  #docList .open {
    flex: 1; min-width: 0; text-align: left; padding: 10px 16px; min-height: 64px;
  }
  #docList .open b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  #docList .open small { color: var(--muted); font-size: 15px; }
  #docList .more { font-size: 24px; line-height: 1; padding: 0; width: 56px; }
  #emptyMsg { color: var(--muted); text-align: center; padding: 30px 20px; }
  #version { color: var(--muted); font-size: 13px; text-align: center; margin: 0; padding: 6px 0 max(10px, env(safe-area-inset-bottom)); }

  #notice {
    display: flex; gap: 10px; align-items: center;
    background: var(--notice-bg); color: var(--notice-text);
    padding: 10px 14px; font-size: 16px;
  }
  #notice[hidden] { display: none; }
  #notice span { flex: 1; }
  #notice button { min-height: 44px; background: transparent; color: inherit; border-color: currentColor; }

  #editor {
    flex: 1; width: 100%; border: 0; resize: none; outline: none;
    background: var(--surface); color: var(--text);
    font: 18px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: var(--doc-font, 18px);
    padding: 16px; tab-size: 4;
  }
  #editor[hidden] { display: none; }
  #reader {
    flex: 1; overflow-y: auto; background: var(--surface); color: var(--text);
    font: 18px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: var(--doc-font, 18px);
    padding: 16px; tab-size: 4; white-space: pre-wrap; overflow-wrap: anywhere;
    -webkit-user-select: text; user-select: text; position: relative;
  }
  #reader[hidden] { display: none; }
  mark { background: #ffe066; color: #1c1c1e; border-radius: 3px; }
  mark.cur { background: #ff9f1c; outline: 2px solid #ff9f1c; }

  #findBar {
    display: flex; gap: 6px; align-items: center; padding: 8px 10px;
    border-bottom: 1px solid var(--line); background: var(--bg);
  }
  #findBar[hidden] { display: none; }
  #findInput {
    flex: 1; min-width: 0; font: inherit; font-size: 17px; height: 48px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text);
  }
  #findCount { min-width: 52px; text-align: center; color: var(--muted); font-size: 15px; }
  #findBar button { min-width: 48px; min-height: 48px; padding: 0; }
  .hl { position: absolute; z-index: 1; background: rgba(255, 159, 28, .45); outline: 2px solid #ff9f1c; border-radius: 2px; pointer-events: none; }

  #pdfWrap { flex: 1; overflow: auto; touch-action: pan-x pan-y; background: var(--bg); }
  #pdfWrap[hidden] { display: none; }
  #pdfPages { width: max-content; min-width: 100%; padding: 6px 0 20px; transform-origin: 0 0; }
  .page { margin: 10px auto; background: #fff; box-shadow: var(--page-shadow); position: relative; }
  .page canvas { display: block; width: 100%; height: 100%; }
  #pdfStatus { color: var(--muted); text-align: center; padding: 30px 20px; }

  .tools {
    display: flex; gap: 8px; padding: 8px 10px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--bg);
  }
  .tools[hidden] { display: none; }
  .tools button { flex: 1; padding: 0 6px; font-size: 17px; }
  .tools button.icon { flex: 0 0 54px; font-size: 22px; }
  .tools button.size { flex: 0 0 58px; font-size: 18px; font-weight: 600; }
  .tools .label { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 16px; }
  .tools button.label { background: none; border-color: transparent; }

  dialog {
    border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    background: var(--surface); color: var(--text);
    width: min(92vw, 420px);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { margin: 0 0 8px; font-size: 21px; }
  dialog p { margin: 0 0 14px; color: var(--muted); font-size: 16px; white-space: pre-line; }
  dialog input {
    width: 100%; font: inherit; padding: 12px; margin-bottom: 16px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--text);
  }
  dialog .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
  dialog .btns button { flex: 1 1 auto; }

  #toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-size: 16px; pointer-events: none; opacity: 0; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- Document list -->
<section id="listView" class="view">
  <header class="bar"><h1>Documents</h1></header>
  <div class="actions">
    <button id="newBtn" class="primary">New</button>
    <button id="openBtn">Open file</button>
  </div>
  <input type="file" id="fileInput" hidden>
  <ul id="docList"></ul>
  <p id="emptyMsg" hidden>No documents yet.<br>Tap “New” or “Open file”.<br>Documents are saved only in this browser. Clearing site data deletes them.</p>
  <p id="version"></p>
</section>

<!-- Open document -->
<section id="docView" class="view" hidden>
  <header class="bar">
    <button id="backBtn" aria-label="Back to list">← Back</button>
    <div class="title"><b id="docTitle"></b><small id="docState"></small></div>
    <button id="findBtn" aria-label="Find in document">Find</button>
  </header>
  <div id="findBar" hidden>
    <input id="findInput" type="search" placeholder="Find…" enterkeyhint="search" autocomplete="off" aria-label="Text to find">
    <span id="findCount"></span>
    <button id="findPrev" aria-label="Previous match">↑</button>
    <button id="findNext" aria-label="Next match">↓</button>
    <button id="findClose" aria-label="Close search">✕</button>
  </div>
  <div id="notice" hidden><span id="noticeText"></span><button id="noticeOk">OK</button></div>
  <div id="reader" hidden></div>
  <textarea id="editor" hidden autocapitalize="sentences" aria-label="Document text"></textarea>
  <div id="pdfWrap" hidden><div id="pdfPages"></div></div>
  <footer id="readTools" class="tools" hidden>
    <button id="smallerBtn" class="size" aria-label="Smaller text">A−</button>
    <button id="biggerBtn" class="size" aria-label="Bigger text">A+</button>
    <button id="editBtn" class="primary">Edit</button>
    <button id="exportBtn2">Export</button>
  </footer>
  <footer id="textTools" class="tools" hidden>
    <button id="undoBtn" class="icon" aria-label="Undo">↶</button>
    <button id="redoBtn" class="icon" aria-label="Redo">↷</button>
    <button id="saveBtn" class="primary">Save</button>
    <button id="exportBtn">Export</button>
    <button id="doneBtn">Done</button>
  </footer>
  <footer id="pdfTools" class="tools" hidden>
    <button id="zoomOut" aria-label="Zoom out">−</button>
    <button id="zoomLabel" aria-label="Reset zoom">100%</button>
    <button id="zoomIn" aria-label="Zoom in">+</button>
    <button id="pageLabel" class="label" aria-label="Go to page"></button>
  </footer>
</section>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <h3 id="dlgTitle"></h3>
  <p id="dlgMsg"></p>
  <input id="dlgInput" type="text" autocomplete="off" aria-label="Name">
  <div class="btns" id="dlgBtns"></div>
</dialog>
<div id="toast" role="status"></div>

<script src="jszip.min.js"></script>
<script type="module">
const $ = (id) => document.getElementById(id);
const els = {
  listView: $('listView'), docView: $('docView'), docList: $('docList'), emptyMsg: $('emptyMsg'),
  fileInput: $('fileInput'), editor: $('editor'), pdfWrap: $('pdfWrap'), pdfPages: $('pdfPages'),
  textTools: $('textTools'), pdfTools: $('pdfTools'), docTitle: $('docTitle'), docState: $('docState'),
  notice: $('notice'), noticeText: $('noticeText'), undoBtn: $('undoBtn'), redoBtn: $('redoBtn'),
  zoomLabel: $('zoomLabel'), pageLabel: $('pageLabel'),
  reader: $('reader'), readTools: $('readTools'),
  findBar: $('findBar'), findInput: $('findInput'), findCount: $('findCount'),
};

/* ---------- Storage (IndexedDB: stays on this phone only) ---------- */
const DB_NAME = 'pocketdocs', STORE = 'docs';
let dbPromise;
function db() {
  dbPromise ??= new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function tx(mode, fn) {
  const d = await db();
  return new Promise((resolve, reject) => {
    const t = d.transaction(STORE, mode);
    const r = fn(t.objectStore(STORE));
    t.oncomplete = () => resolve(r?.result);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error || new Error('Storage is full or unavailable.'));
  });
}
const dbAll = () => tx('readonly', (s) => s.getAll());
const dbPut = (doc) => tx('readwrite', (s) => s.put(doc));
const dbDel = (id) => tx('readwrite', (s) => s.delete(id));
let persistAsked = false;
function askPersist() {
  if (persistAsked) return;
  persistAsked = true;
  navigator.storage?.persist?.().catch(() => {});
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- Small UI helpers ---------- */
const dlg = $('dlg');
let dlgResolve = null;
function ask({ title, message = '', input = null, inputMode = 'text', buttons }) {
  if (dlgResolve) { dlgResolve(null); dlgResolve = null; if (dlg.open) dlg.close(); }
  $('dlgTitle').textContent = title;
  $('dlgMsg').textContent = message;
  $('dlgMsg').hidden = !message;
  const inp = $('dlgInput');
  inp.hidden = input === null;
  inp.value = input ?? '';
  inp.inputMode = inputMode;
  const box = $('dlgBtns');
  box.replaceChildren();
  return new Promise((resolve) => {
    dlgResolve = resolve;
    const finish = (val) => { if (dlgResolve !== resolve) return; dlgResolve = null; dlg.close(); resolve(val); };
    for (const b of buttons) {
      const el = document.createElement('button');
      el.textContent = b.label;
      if (b.primary) el.className = 'primary';
      if (b.danger) el.className = 'danger';
      el.onclick = () => finish(b.value === '__input__' ? inp.value : b.value);
      box.append(el);
    }
    inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); finish(inp.value); } };
    dlg.oncancel = (e) => { e.preventDefault(); finish(null); };
    dlg.showModal();
    if (input !== null) { inp.focus(); inp.select(); }
  });
}
const info = (title, message) => ask({ title, message, buttons: [{ label: 'OK', value: true, primary: true }] });
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}
const fmtDate = (ms) => new Date(ms).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
const KIND_LABEL = { txt: 'Text', md: 'Markdown', docx: 'Word', odt: 'ODT', pdf: 'PDF' };

/* ---------- Document list ---------- */
async function renderList() {
  const docs = (await dbAll()).sort((a, b) => b.updated - a.updated);
  els.docList.replaceChildren();
  els.emptyMsg.hidden = docs.length > 0;
  for (const doc of docs) {
    const li = document.createElement('li');
    const open = document.createElement('button');
    open.className = 'open';
    const b = document.createElement('b'); b.textContent = doc.name;
    const s = document.createElement('small'); s.textContent = `${KIND_LABEL[doc.format] || 'Text'} · ${fmtDate(doc.updated)}`;
    open.append(b, s);
    open.onclick = () => openDoc(doc);
    const more = document.createElement('button');
    more.className = 'more'; more.textContent = '⋯'; more.setAttribute('aria-label', `Options for ${doc.name}`);
    more.onclick = () => docOptions(doc);
    li.append(open, more);
    els.docList.append(li);
  }
}
async function docOptions(doc) {
  const choice = await ask({
    title: doc.name,
    buttons: [
      { label: 'Rename', value: 'rename' },
      { label: 'Delete', value: 'delete', danger: true },
      { label: 'Cancel', value: null },
    ],
  });
  if (choice === 'rename') {
    const name = await ask({ title: 'Rename', input: doc.name, buttons: [{ label: 'Cancel', value: null }, { label: 'Rename', value: '__input__', primary: true }] });
    if (name !== null && name.trim()) { doc.name = name.trim(); doc.updated = Date.now(); await dbPut(doc); renderList(); }
  } else if (choice === 'delete') {
    const ok = await ask({ title: 'Delete document?', message: `“${doc.name}” will be removed from this app. This can't be undone.`, buttons: [{ label: 'Cancel', value: false }, { label: 'Delete', value: true, danger: true }] });
    if (ok) { await dbDel(doc.id); forgetPos(doc.id); renderList(); toast('Deleted'); }
  }
}

/* ---------- Opening files from the phone ---------- */
$('openBtn').onclick = () => els.fileInput.click();
els.fileInput.onchange = async () => {
  const file = els.fileInput.files[0];
  els.fileInput.value = '';
  if (!file) return;
  const doc = await importFile(file);
  if (doc) { renderList(); openDoc(doc); }
};
// Files shared from other apps sometimes arrive without an extension, so fall back to the file type.
const TYPE_EXT = {
  'text/plain': 'txt', 'text/markdown': 'md', 'text/x-markdown': 'md', 'application/pdf': 'pdf',
  'application/vnd.openxmlformats-officedocument.wordprocessingml.document': 'docx',
  'application/vnd.oasis.opendocument.text': 'odt',
};
const MAX_FILE = 100 * 1024 * 1024; // 100 MB
// Reads a file and saves it in the app. Returns the new document, or null if it couldn't be opened.
async function importFile(file) {
  if (file.size > MAX_FILE) {
    await info('File too large', '“' + file.name + '” is bigger than 100 MB. Pocket Docs can’t open it.');
    return null;
  }
  const dot = file.name.lastIndexOf('.');
  let ext = dot > 0 ? file.name.slice(dot + 1).toLowerCase() : '';
  const base = dot > 0 ? file.name.slice(0, dot) : file.name;
  if (!['txt', 'md', 'markdown', 'docx', 'odt', 'pdf'].includes(ext) && TYPE_EXT[file.type]) ext = TYPE_EXT[file.type];
  const now = Date.now();
  const doc = { id: newId(), name: base || 'Untitled', format: ext, created: now, updated: now, saved: true };
  try {
    if (ext === 'txt' || ext === 'md' || ext === 'markdown') {
      doc.format = ext === 'txt' ? 'txt' : 'md';
      doc.kind = 'text';
      doc.text = new TextDecoder('utf-8').decode(await file.arrayBuffer());
    } else if (ext === 'docx') {
      doc.kind = 'text';
      const { text, lost } = await readDocx(file);
      doc.text = text;
      doc.notice = lost;
    } else if (ext === 'odt') {
      doc.kind = 'text';
      const { text, lost } = await readOdt(file);
      doc.text = text;
      doc.notice = lost;
    } else if (ext === 'pdf') {
      const buf = await file.arrayBuffer();
      const head = new TextDecoder('latin1').decode(new Uint8Array(buf, 0, Math.min(1024, buf.byteLength)));
      if (!head.includes('%PDF')) throw new Error('This file does not look like a PDF.');
      doc.kind = 'pdf';
      doc.data = new Blob([buf], { type: 'application/pdf' });
    } else {
      await info('Can’t open “' + file.name + '”', 'This app opens .txt, .md, .docx, .odt and .pdf files.' + (ext === 'doc' ? '\n\nOld .doc files aren’t supported — save it as .docx first.' : ''));
      return null;
    }
    await dbPut(doc);
    askPersist();
    return doc;
  } catch (err) {
    console.error(err);
    await info('Couldn’t open “' + file.name + '”', err?.message || String(err));
    return null;
  }
}

/* ---------- .docx reading (text only) ---------- */
const W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
async function readDocx(file) {
  let zip;
  try { zip = await JSZip.loadAsync(await file.arrayBuffer()); }
  catch { throw new Error('This .docx file seems to be damaged.'); }
  const part = zip.file('word/document.xml');
  if (!part) throw new Error('No document text was found in this .docx file.');
  const xml = new DOMParser().parseFromString(await part.async('string'), 'application/xml');
  if (xml.getElementsByTagName('parsererror').length) throw new Error('This .docx file seems to be damaged.');
  const body = xml.getElementsByTagNameNS(W_NS, 'body')[0];
  const lines = [];
  const SKIP = new Set(['del', 'delText', 'instrText', 'rPr', 'pPr', 'sectPr', 'fldData']);

  function runText(node) {
    let out = '';
    for (const n of node.childNodes) {
      if (n.nodeType !== 1) continue;
      if (n.namespaceURI === W_NS) {
        const name = n.localName;
        if (SKIP.has(name)) continue;
        if (name === 't') { out += n.textContent; continue; }
        if (name === 'tab' || name === 'ptab') { out += '\t'; continue; }
        if (name === 'br' || name === 'cr') { out += '\n'; continue; }
        if (name === 'noBreakHyphen') { out += '-'; continue; }
        if (name === 'p') { out += runText(n) + ' '; continue; } // nested paragraph (e.g. text box)
      }
      out += runText(n);
    }
    return out;
  }
  function block(node) {
    for (const n of node.childNodes) {
      if (n.nodeType !== 1) continue;
      if (n.namespaceURI === W_NS && n.localName === 'p') lines.push(runText(n));
      else if (n.namespaceURI === W_NS && n.localName === 'tbl') {
        for (const tr of n.childNodes) {
          if (tr.localName !== 'tr') continue;
          const cells = [];
          for (const tc of tr.childNodes) {
            if (tc.localName !== 'tc') continue;
            const before = lines.length;
            block(tc);
            cells.push(lines.splice(before).join(' ').trim());
          }
          lines.push(cells.join('\t'));
        }
      } else if (n.namespaceURI !== W_NS || !SKIP.has(n.localName)) block(n);
    }
  }
  if (body) block(body);

  const count = (tag) => xml.getElementsByTagNameNS(W_NS, tag).length;
  const lost = [];
  const fmt = ['b', 'i', 'u', 'color', 'sz', 'highlight', 'rFonts', 'pStyle', 'jc'].some((t) => count(t) > 0);
  if (fmt) lost.push('formatting (bold, fonts, sizes, headings, alignment)');
  if (count('numPr')) lost.push('bullets and numbering');
  if (count('tbl')) lost.push(`${count('tbl')} table(s) — their text is kept, one row per line`);
  const pics = count('drawing') + count('pict') + count('object');
  if (pics) lost.push(`${pics} image(s) or drawing(s)`);
  if (zip.file(/^word\/(header|footer)\d*\.xml$/).length) lost.push('headers and footers');
  if (zip.file('word/footnotes.xml') || zip.file('word/endnotes.xml')) lost.push('footnotes');
  if (zip.file('word/comments.xml')) lost.push('comments');
  const notice = 'Word file: only the text was kept.' + (lost.length ? ' Removed: ' + lost.join('; ') + '.' : ' Any formatting was removed.');
  return { text: lines.join('\n'), lost: notice };
}

/* ---------- .docx writing (plain paragraphs) ---------- */
function xmlEsc(s) {
  return s.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
async function makeDocx(text) {

/* ---------- .odt reading (text only) ---------- */
const ODF = {
  text: 'urn:oasis:names:tc:opendocument:xmlns:text:1.0',
  table: 'urn:oasis:names:tc:opendocument:xmlns:table:1.0',
  office: 'urn:oasis:names:tc:opendocument:xmlns:office:1.0',
  draw: 'urn:oasis:names:tc:opendocument:xmlns:drawing:1.0',
};
async function readOdt(file) {
  let zip;
  try { zip = await JSZip.loadAsync(await file.arrayBuffer()); }
  catch { throw new Error('This .odt file seems to be damaged.'); }
  const manifest = zip.file('META-INF/manifest.xml');
  if (manifest && (await manifest.async('string')).includes('encryption-data')) throw new Error('This .odt file is password-protected and can’t be opened here.');
  const part = zip.file('content.xml');
  if (!part) throw new Error('No document text was found in this .odt file.');
  const xml = new DOMParser().parseFromString(await part.async('string'), 'application/xml');
  if (xml.getElementsByTagName('parsererror').length) throw new Error('This .odt file seems to be damaged.');
  const body = xml.getElementsByTagNameNS(ODF.office, 'text')[0];
  const lines = [];
  const SKIP = new Set(['sequence-decls', 'variable-decls', 'user-field-decls', 'tracked-changes', 'note', 'soft-page-break', 'bookmark', 'bookmark-start', 'bookmark-end']);
  const skip = (n) => (n.namespaceURI === ODF.text && (SKIP.has(n.localName) || n.localName.endsWith('-source')))
    || (n.namespaceURI === ODF.office && (n.localName === 'annotation' || n.localName === 'annotation-end' || n.localName === 'forms'));

  function inline(node) {
    let out = '';
    for (const n of node.childNodes) {
      if (n.nodeType === 3) { out += n.data.replace(/[ \t\r\n]+/g, ' '); continue; }
      if (n.nodeType !== 1 || skip(n)) continue;
      if (n.namespaceURI === ODF.text) {
        const name = n.localName;
        if (name === 's') { out += ' '.repeat(Math.min(1000, +n.getAttributeNS(ODF.text, 'c') || 1)); continue; }
        if (name === 'tab') { out += '\t'; continue; }
        if (name === 'line-break') { out += '\n'; continue; }
        if (name === 'p' || name === 'h') { out += inline(n) + ' '; continue; } // text inside a text box
      }
      out += inline(n);
    }
    return out;
  }
  function rows(node, out) {
    for (const n of node.children) {
      if (n.namespaceURI !== ODF.table) continue;
      if (n.localName === 'table-row') out.push(n);
      else if (/^table-(header-)?rows$|^table-row-group$/.test(n.localName)) rows(n, out);
    }
    return out;
  }
  function block(node) {
    for (const n of node.children) {
      if (skip(n)) continue;
      if (n.namespaceURI === ODF.text && (n.localName === 'p' || n.localName === 'h')) lines.push(inline(n).replace(/^ /, ''));
      else if (n.namespaceURI === ODF.table && n.localName === 'table') {
        for (const tr of rows(n, [])) {
          const cells = [];
          for (const tc of tr.children) {
            if (tc.namespaceURI !== ODF.table || !/^(covered-)?table-cell$/.test(tc.localName)) continue;
            const before = lines.length;
            block(tc);
            cells.push(lines.splice(before).join(' ').trim());
          }
          while (cells.length && !cells[cells.length - 1]) cells.pop();
          lines.push(cells.join('\t'));
        }
      } else if (n.namespaceURI === ODF.draw && n.localName === 'frame') {
        const t = inline(n).trim();
        if (t) lines.push(t);
      } else block(n);
    }
  }
  if (body) block(body);

  const count = (ns, tag) => xml.getElementsByTagNameNS(ns, tag).length;
  const lost = [];
  if (count(ODF.text, 'span') || count(ODF.text, 'h') || xml.getElementsByTagNameNS(ODF.office, 'automatic-styles')[0]?.children.length) lost.push('formatting (bold, fonts, sizes, headings, alignment)');
  if (count(ODF.text, 'list')) lost.push('bullets and numbering');
  if (count(ODF.table, 'table')) lost.push(`${count(ODF.table, 'table')} table(s) — their text is kept, one row per line`);
  const pics = count(ODF.draw, 'image') + count(ODF.draw, 'object');
  if (pics) lost.push(`${pics} image(s) or object(s)`);
  const styles = zip.file('styles.xml');
  if (styles && /<style:(header|footer)[\s>]/.test(await styles.async('string'))) lost.push('headers and footers');
  if (count(ODF.text, 'note')) lost.push('footnotes');
  if (count(ODF.office, 'annotation')) lost.push('comments');
  const notice = 'OpenDocument file: only the text was kept.' + (lost.length ? ' Removed: ' + lost.join('; ') + '.' : ' Any formatting was removed.');
  return { text: lines.join('\n'), lost: notice };
}

/* ---------- .odt writing (plain paragraphs) ---------- */
async function makeOdt(text) {
  const para = (line) => {
    if (!line) return '<text:p/>';
    const inner = line.split('\t').map((seg) => xmlEsc(seg)
      .replace(/^ +/, (m) => `<text:s text:c="${m.length}"/>`)
      .replace(/ {2,}/g, (m) => ' ' + `<text:s text:c="${m.length - 1}"/>`)).join('<text:tab/>');
    return `<text:p>${inner}</text:p>`;
  };
  const paras = text.split(/\r\n|\r|\n/).map(para).join('');
  const zip = new JSZip();
  // The "mimetype" file must come first and must not be compressed.
  zip.file('mimetype', 'application/vnd.oasis.opendocument.text', { compression: 'STORE' });
  zip.file('META-INF/manifest.xml', '<?xml version="1.0" encoding="UTF-8"?><manifest:manifest xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0" manifest:version="1.3"><manifest:file-entry manifest:full-path="/" manifest:version="1.3" manifest:media-type="application/vnd.oasis.opendocument.text"/><manifest:file-entry manifest:full-path="content.xml" manifest:media-type="text/xml"/></manifest:manifest>');
  zip.file('content.xml', `<?xml version="1.0" encoding="UTF-8"?><office:document-content xmlns:office="${ODF.office}" xmlns:text="${ODF.text}" office:version="1.3"><office:body><office:text>${paras}</office:text></office:body></office:document-content>`);
  return zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.oasis.opendocument.text' });
}

/* ---------- Document view ---------- */
let current = null;      // the open document
let savedText = '';      // text as last saved, to know if there are unsaved changes

  els.listView.hidden = name !== 'list';
  els.docView.hidden = name !== 'doc';
}
function setNotice(text) {
  els.noticeText.textContent = text || '';
  els.notice.hidden = !text;
}
$('noticeOk').onclick = () => {
  setNotice('');
  // Seen it once: don't show it again for this document.
  if (current?.notice && current.saved) { current.notice = ''; dbPut(current).catch(() => {}); }
};

let mode = 'read';       // text documents: 'read' (no keyboard) or 'edit'

function openDoc(doc) {
  current = doc;
  els.findInput.value = '';

  closeFind();
  els.docTitle.textContent = doc.name;
  const isPdf = doc.kind === 'pdf';
  els.editor.hidden = els.reader.hidden = els.textTools.hidden = els.readTools.hidden = true;
  els.pdfWrap.hidden = !isPdf; els.pdfTools.hidden = !isPdf;

}
function closeDoc() {

  closeFind();
  current = null;
  els.editor.value = '';
  els.reader.textContent = '';

  showView('list');
  renderList();
}
function setMode(m) {

  const ratio = from.scrollTop / Math.max(1, from.scrollHeight - from.clientHeight);
  mode = m;
  els.reader.hidden = els.readTools.hidden = m !== 'read';
  els.editor.hidden = els.textTools.hidden = m !== 'edit';
  if (m === 'read') renderReader();
  const to = m === 'edit' ? els.editor : els.reader;
  to.scrollTop = ratio * (to.scrollHeight - to.clientHeight);

  updateState();

}

  const label = KIND_LABEL[current.format] || 'Text';
  if (mode === 'read') { els.docState.textContent = label + ' · reading'; return; }
  els.docState.textContent = label + (!current.saved ? ' · not saved yet' : isDirty() ? ' · unsaved changes' : ' · saved');
  els.undoBtn.disabled = hpos <= 0 && !pendingHist;
  els.redoBtn.disabled = hpos >= hist.length - 1;
}
$('editBtn').onclick = () => setMode('edit');
$('doneBtn').onclick = async () => {
  if (isDirty()) {
    const choice = await ask({ title: 'Save changes?', message: 'You have unsaved changes.', buttons: [{ label: 'Discard', value: 'discard', danger: true }, { label: 'Cancel', value: null }, { label: 'Save', value: 'save', primary: true }] });
    if (choice === null) return;
    if (choice === 'save' && !(await save())) return;
    if (choice === 'discard') {
      if (!current.saved) { savedText = els.editor.value; history.back(); return; } // never saved: back to the list
      els.editor.value = savedText;
      histReset();
    }
  } else if (!current.saved) { savedText = els.editor.value; history.back(); return; }
  els.editor.blur();
  setMode('read');
};

$('newBtn').onclick = () => {
  const now = Date.now();
  openDoc({ id: newId(), name: 'Untitled', kind: 'text', format: 'txt', text: '', created: now, updated: now, saved: false });
};

async function save() {
  if (!current || current.kind !== 'text') return true;
  if (!current.saved) {
    const name = await ask({ title: 'Save as', message: 'Name for this document:', input: current.name, buttons: [{ label: 'Cancel', value: null }, { label: 'Save', value: '__input__', primary: true }] });
    if (name === null) return false;
    current.name = name.trim() || 'Untitled';
    els.docTitle.textContent = current.name;
  }
  flushHist();
  current.text = els.editor.value;
  current.updated = Date.now();
  current.saved = true;
  try { await dbPut(current); }
  catch (err) { await info('Couldn’t save', err?.message || String(err)); return false; }
  savedText = current.text;
  askPersist();
  updateState();
  toast('Saved');
  return true;
}
$('saveBtn').onclick = save;

async function leaveAllowed() {
  if (!isDirty()) return true;
  const choice = await ask({ title: 'Save changes?', message: 'You have unsaved changes.', buttons: [{ label: 'Discard', value: 'discard', danger: true }, { label: 'Cancel', value: null }, { label: 'Save', value: 'save', primary: true }] });
  if (choice === 'discard') return true;

}
$('backBtn').onclick = () => history.back();
window.addEventListener('popstate', async () => {
  if (!current) return;
  if (await leaveAllowed()) closeDoc();
  else history.pushState({ doc: current.id }, '');

/* ---------- Export ---------- */
function safeName(name) {
  return (name.replace(/\.(txt|md|markdown|docx|odt|pdf)$/i, '').replace(/[\\/:*?"<>|]+/g, '_').trim() || 'document');
}
function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 20000);
}
$('exportBtn').onclick = $('exportBtn2').onclick = async () => {
  if (!current) return;
  const fmt = await ask({
    title: 'Export as…',
    message: 'The file goes to your phone’s Downloads folder.\n.docx and .odt exports contain plain text only.',
    buttons: [{ label: '.txt', value: 'txt' }, { label: '.md', value: 'md' }, { label: '.docx', value: 'docx' }, { label: '.odt', value: 'odt' }, { label: 'Cancel', value: null }],
  });
  if (!fmt) return;
  const text = els.editor.value;
  const name = safeName(current.name) + '.' + fmt;
  try {
    if (fmt === 'docx') download(await makeDocx(text), name);
    else if (fmt === 'odt') download(await makeOdt(text), name);
    else download(new Blob([text], { type: fmt === 'md' ? 'text/markdown;charset=utf-8' : 'text/plain;charset=utf-8' }), name);
    toast('Exported ' + name);
  } catch (err) { info('Export failed', err?.message || String(err)); }
};

/* ---------- Undo / redo ---------- */
let hist = [], hpos = 0, pendingHist = false, histTimer;
const MAX_HIST = 300;
function snap() { return { v: els.editor.value, s: els.editor.selectionStart, e: els.editor.selectionEnd }; }
function histReset() { hist = [snap()]; hpos = 0; pendingHist = false; clearTimeout(histTimer); }
function flushHist() {
  clearTimeout(histTimer);
  pendingHist = false;
  if (hist[hpos].v === els.editor.value) return;
  hist = hist.slice(0, hpos + 1);
  hist.push(snap());
  if (hist.length > MAX_HIST) hist.shift();
  hpos = hist.length - 1;
}
function applySnap(sn) {
  els.editor.value = sn.v;
  els.editor.setSelectionRange(sn.s, sn.e);
  updateState();
}
function undo() { flushHist(); if (hpos > 0) { hpos--; applySnap(hist[hpos]); } }
function redo() { flushHist(); if (hpos < hist.length - 1) { hpos++; applySnap(hist[hpos]); } }
els.editor.addEventListener('input', (e) => {
  // Paste, cut and drops get their own undo step; typing is grouped by short pauses.
  if (/Paste|Cut|Drop/i.test(e.inputType || '')) flushHist();
  else { pendingHist = true; clearTimeout(histTimer); histTimer = setTimeout(() => { flushHist(); updateState(); }, 500); }
  updateState();
});
els.editor.addEventListener('beforeinput', (e) => {
  if (e.inputType === 'historyUndo') { e.preventDefault(); undo(); }
  if (e.inputType === 'historyRedo') { e.preventDefault(); redo(); }
});
els.editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '\t'); }
});
// Keep the keyboard open when tapping Undo/Redo
for (const b of [els.undoBtn, els.redoBtn]) b.addEventListener('pointerdown', (e) => e.preventDefault());
els.undoBtn.onclick = undo;
els.redoBtn.onclick = redo;

/* ---------- PDF viewer (view only) ---------- */
let pdfjs = null, pdfDoc = null, pdfTask = null, pdfPages = [], zoom = 1, baseScale = 1, observer = null, pdfToken = 0;
const ZOOM_MIN = 0.5, ZOOM_MAX = 5;
const MAX_CANVAS_PIXELS = 8_000_000;

async function showPdf(blob) {
  const token = ++pdfToken;
  els.pdfPages.replaceChildren(statusEl('Opening PDF…'));
  els.pageLabel.textContent = '';
  zoom = 1;
  try {
    if (!pdfjs) {
      pdfjs = await import('./pdf.min.js');
      pdfjs.GlobalWorkerOptions.workerSrc = new URL('pdf.worker.min.js', location.href).href;
    }
    const data = new Uint8Array(await blob.arrayBuffer());
    const task = pdfjs.getDocument({
      data, isEvalSupported: false, enableXfa: false,
      standardFontDataUrl: new URL('./', location.href).href,
      wasmUrl: new URL('./', location.href).href,
    });

    if (token !== pdfToken) { task.destroy(); return; }
    pdfTask = task; pdfDoc = doc;
    const first = await doc.getPage(1);
    const vp = first.getViewport({ scale: 1 });
    baseScale = Math.max(0.1, (els.pdfWrap.clientWidth - 16) / vp.width);
    pdfPages = [];
    for (let i = 1; i <= doc.numPages; i++) pdfPages.push({ num: i, page: i === 1 ? first : null, div: null, canvas: null, task: null, drawnAt: 0 });

    pdfPages.forEach((p) => { p.w = vp.width; p.h = vp.height; });

    restorePdfPos();
    // Fill in true sizes for pages that differ (cheap, no rendering).
    for (const p of pdfPages.slice(1)) {
      if (token !== pdfToken) return;
      p.page = await doc.getPage(p.num);
      const v = p.page.getViewport({ scale: 1 });
      if (v.width !== p.w || v.height !== p.h) { p.w = v.width; p.h = v.height; sizePage(p); }
    }
  } catch (err) {

    console.error(err);
    const msg = err?.name === 'PasswordException' ? 'This PDF is password-protected and can’t be opened here.' : 'This PDF could not be displayed. ' + (err?.message || '');

function updatePageLabel() {

els.pdfWrap.addEventListener('scroll', updatePageLabel, { passive: true });
// Tap the page label to jump to a page; numbers out of range go to the first or last page.
els.pageLabel.onclick = async () => {

  if (token !== pdfToken || !pdfPages.length || isNaN(n)) return;
  const p = pdfPages[Math.min(pdfPages.length, Math.max(1, n)) - 1];
  const wr = els.pdfWrap.getBoundingClientRect(), pr = p.div.getBoundingClientRect();
  els.pdfWrap.scrollTop += pr.top - wr.top;
  updatePageLabel();
};

function setZoom(z, ax, ay) {
  if (!pdfPages.length) return;
  z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
  const w = els.pdfWrap;
  ax ??= w.clientWidth / 2; ay ??= w.clientHeight / 2;
  const f = z / zoom;
  const cx = w.scrollLeft + ax, cy = w.scrollTop + ay;
  zoom = z;
  buildPages();
  w.scrollLeft = cx * f - ax;
  w.scrollTop = cy * f - ay;
  updatePageLabel();
}
const STEPS = [0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3, 4, 5];
$('zoomIn').onclick = () => setZoom(STEPS.find((s) => s > zoom + 0.01) ?? ZOOM_MAX);
$('zoomOut').onclick = () => setZoom([...STEPS].reverse().find((s) => s < zoom - 0.01) ?? ZOOM_MIN);
els.zoomLabel.onclick = () => setZoom(1);

// Two-finger pinch to zoom
let pinch = null;
const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
els.pdfWrap.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2 && pdfPages.length) {
    const r = els.pdfWrap.getBoundingClientRect();
    const ax = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
    const ay = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
    pinch = { d: dist(e.touches), ratio: 1, ax, ay };
    els.pdfPages.style.transformOrigin = `${els.pdfWrap.scrollLeft + ax}px ${els.pdfWrap.scrollTop + ay}px`;
  }
}, { passive: true });
els.pdfWrap.addEventListener('touchmove', (e) => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  const minR = ZOOM_MIN / zoom, maxR = ZOOM_MAX / zoom;
  pinch.ratio = Math.min(maxR, Math.max(minR, dist(e.touches) / pinch.d));
  els.pdfPages.style.transform = `scale(${pinch.ratio})`;
}, { passive: false });
els.pdfWrap.addEventListener('touchend', (e) => {
  if (!pinch || e.touches.length >= 2) return;
  const { ratio, ax, ay } = pinch;
  pinch = null;
  els.pdfPages.style.transform = '';
  if (Math.abs(ratio - 1) > 0.03) setZoom(zoom * ratio, ax, ay);
});
window.addEventListener('resize', () => {
  if (!pdfDoc || !pdfPages.length) return;
  const nb = Math.max(0.1, (els.pdfWrap.clientWidth - 16) / pdfPages[0].w);
  if (Math.abs(nb - baseScale) > 0.01) { baseScale = nb; buildPages(); }
});

/* ---------- Find in document ---------- */
const find = { open: false, q: '', re: null, hits: [], idx: -1, pdfText: null, pdfHl: null };
const MAX_HITS = 5000;
const makeRe = (q) => new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'giu');
function allHits(text, re) {
  const hits = [];
  re.lastIndex = 0;
  let m;
  while ((m = re.exec(text)) && hits.length < MAX_HITS) {
    hits.push([m.index, m.index + m[0].length]);
    if (!m[0].length) re.lastIndex++;
  }
  return hits;
}
function updateCount() {
  const n = find.hits.length;
  els.findCount.textContent = !find.re ? '' : !n ? 'none' : (find.idx < 0 ? '' : (find.idx + 1) + '/') + (n >= MAX_HITS ? n + '+' : n);
}
function openFind() {
  find.open = true;
  els.findBar.hidden = false;
  els.findInput.focus();
  els.findInput.select();
}
function closeFind() {
  find.open = false;
  els.findBar.hidden = true;
  find.q = ''; find.re = null; find.hits = []; find.idx = -1;
  els.findCount.textContent = '';
  clearPdfHl();
  if (current?.kind === 'text' && mode === 'read') renderReader();
}
$('findBtn').onclick = () => (find.open ? closeFind() : openFind());
$('findClose').onclick = closeFind;
let findTimer;
els.findInput.addEventListener('input', () => {
  clearTimeout(findTimer);
  findTimer = setTimeout(() => runFind(false), current?.kind === 'pdf' ? 500 : 250);
});
els.findInput.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  step(e.shiftKey ? -1 : 1);
});
// Keep the keyboard on the search box when tapping ↑ / ↓
for (const id of ['findPrev', 'findNext']) $(id).addEventListener('pointerdown', (e) => e.preventDefault());
$('findPrev').onclick = () => step(-1);
$('findNext').onclick = () => step(1);

async function runFind(navigate) {
  clearTimeout(findTimer);
  const q = els.findInput.value;
  find.q = q; find.hits = []; find.idx = -1;
  find.re = q.trim() ? makeRe(q) : null;
  clearPdfHl();
  if (!current) return;
  if (current.kind === 'pdf') {
    if (!find.re) { updateCount(); return; }
    let pages;
    try { pages = await loadPdfText(); } catch { return; }
    if (find.q !== q) return; // the search text changed meanwhile
    pages.forEach((pg, i) => {
      for (const [s, e] of allHits(pg.s, find.re)) if (find.hits.length < MAX_HITS) find.hits.push({ num: i + 1, s, e });
    });
    if (!find.hits.length && pages.every((pg) => !pg.s.trim())) { els.findCount.textContent = 'no text'; info('Can’t search this PDF', 'This PDF has no searchable text. It is probably a scanned image.'); return; }
    const here = currentPage();
    find.idx = find.hits.length ? Math.max(0, find.hits.findIndex((h) => h.num >= here)) : -1;
    showPdfHit();
    return;
  }
  if (mode === 'read') {
    if (find.re) find.hits = allHits(els.editor.value, find.re);
    renderReader();
    if (find.hits.length) {
      // Start from the first match at or below where you are reading.
      const marks = els.reader.getElementsByTagName('mark');
      const top = els.reader.scrollTop;
      let i = [...marks].findIndex((mk) => mk.offsetTop >= top);
      find.idx = i < 0 ? 0 : i;
      showTextHit();
    } else updateCount();
  } else {
    if (find.re) find.hits = allHits(els.editor.value, find.re);
    updateCount();
    if (navigate) editStep(1);
  }
}
function step(dir) {
  if (!current) return;
  if (find.q !== els.findInput.value || !find.re) return runFind(true);
  if (current.kind === 'text' && mode === 'edit') return editStep(dir);
  const n = find.hits.length;
  if (!n) return;
  find.idx = (find.idx + dir + n) % n;
  current.kind === 'pdf' ? showPdfHit() : showTextHit();
}

/* Text documents */
function renderReader() {
  const text = els.editor.value;
  if (!find.re || !find.hits.length) { els.reader.textContent = text; return; }
  const frag = document.createDocumentFragment();
  let pos = 0;
  for (const [s, e] of find.hits) {
    if (s > pos) frag.append(text.slice(pos, s));
    const mk = document.createElement('mark');
    mk.textContent = text.slice(s, e);
    frag.append(mk);
    pos = e;
  }
  frag.append(text.slice(pos));
  els.reader.replaceChildren(frag);
}
function showTextHit() {
  updateCount();
  if (find.idx < 0) return;
  if (mode === 'read') {
    const marks = els.reader.getElementsByTagName('mark');
    els.reader.querySelector('mark.cur')?.classList.remove('cur');
    const mk = marks[find.idx];
    if (!mk) return;
    mk.classList.add('cur');
    els.reader.scrollTop = mk.offsetTop - els.reader.clientHeight / 3;
  } else {
    const [s, e] = find.hits[find.idx];
    els.editor.focus({ preventScroll: true });
    els.editor.setSelectionRange(s, e);
    scrollEditorTo(s);
    setTimeout(() => scrollEditorTo(s), 350); // again after the keyboard has opened
  }
}
function editStep(dir) {
  // The text may have been edited, so look again and go from the cursor.
  find.hits = find.re ? allHits(els.editor.value, find.re) : [];
  if (!find.hits.length) { find.idx = -1; updateCount(); return; }
  const selS = els.editor.selectionStart, selE = els.editor.selectionEnd;
  let i;
  if (dir > 0) { i = find.hits.findIndex((h) => h[0] >= selE && !(h[0] === selS && h[1] === selE)); if (i < 0) i = 0; }
  else { i = find.hits.findLastIndex((h) => h[1] <= selS && !(h[0] === selS && h[1] === selE)); if (i < 0) i = find.hits.length - 1; }
  find.idx = i;
  showTextHit();
}
// A textarea can't scroll to a position by itself, so measure it with an invisible copy.
function scrollEditorTo(index) {
  const ed = els.editor, cs = getComputedStyle(ed);
  const m = document.createElement('div');
  for (const p of ['font', 'letterSpacing', 'padding', 'tabSize', 'lineHeight']) m.style[p] = cs[p];
  Object.assign(m.style, { position: 'absolute', visibility: 'hidden', left: '-9999px', top: '0', boxSizing: 'border-box', width: ed.clientWidth + 'px', whiteSpace: 'pre-wrap', overflowWrap: 'break-word' });
  m.textContent = ed.value.slice(0, index);
  const marker = document.createElement('span');
  marker.textContent = '​';
  m.append(marker);
  document.body.append(m);
  const top = marker.offsetTop;
  m.remove();
  ed.scrollTop = top - ed.clientHeight / 3;
}

/* PDFs */
async function loadPdfText() {
  if (find.pdfText) return find.pdfText;
  if (!pdfDoc || !pdfPages.length) throw new Error('not ready');
  const token = pdfToken;
  const pages = [];
  for (const p of pdfPages) {
    p.page ??= await pdfDoc.getPage(p.num);
    const tc = await p.page.getTextContent();
    if (token !== pdfToken) throw new Error('closed');
    let s = '';
    const map = [];
    for (const it of tc.items) {
      if (typeof it.str !== 'string') continue;
      map.push({ start: s.length, it });
      s += it.str;
      if (it.hasEOL) s += ' ';
    }
    pages.push({ s, map, vp: p.page.getViewport({ scale: 1 }) });
    els.findCount.textContent = Math.round((100 * p.num) / pdfPages.length) + '%';
  }
  find.pdfText = pages;
  return pages;
}
function showPdfHit() {
  clearPdfHl();
  updateCount();
  if (find.idx < 0) return;
  const h = find.hits[find.idx];
  const pg = find.pdfText[h.num - 1];
  const vp = pg.vp;
  let box = null;
  for (const { start, it } of pg.map) {
    const L = it.str.length;
    const a = Math.max(h.s, start) - start, b = Math.min(h.e, start + L) - start;
    if (!L || b <= a) continue;
    const t = it.transform;
    const ht = it.height || Math.hypot(t[2], t[3]) || 10;
    const x1 = t[4] + (it.width * a) / L, x2 = t[4] + (it.width * b) / L;
    const [ax, ay] = vp.convertToViewportPoint(x1, t[5] - ht * 0.25);
    const [bx, by] = vp.convertToViewportPoint(x2, t[5] + ht * 0.95);
    const r = { l: Math.min(ax, bx), t: Math.min(ay, by), r: Math.max(ax, bx), b: Math.max(ay, by) };
    box = box ? { l: Math.min(box.l, r.l), t: Math.min(box.t, r.t), r: Math.max(box.r, r.r), b: Math.max(box.b, r.b) } : r;
  }
  const p = pdfPages[h.num - 1];
  if (box) find.pdfHl = { num: h.num, l: box.l / vp.width, t: box.t / vp.height, w: (box.r - box.l) / vp.width, h: (box.b - box.t) / vp.height };
  addHl(p);
  const wrap = els.pdfWrap, wr = wrap.getBoundingClientRect(), pr = p.div.getBoundingClientRect();
  const y = (find.pdfHl ? find.pdfHl.t : 0) * pr.height, x = (find.pdfHl ? find.pdfHl.l : 0) * pr.width;
  wrap.scrollTop += pr.top - wr.top + y - wrap.clientHeight / 3;
  if (find.pdfHl) wrap.scrollLeft += pr.left - wr.left + x - wrap.clientWidth / 3;
  updatePageLabel();
}
function addHl(p) {
  const hl = find.pdfHl;
  if (!hl || !p?.div || hl.num !== p.num) return;
  const d = document.createElement('div');
  d.className = 'hl';
  Object.assign(d.style, { left: hl.l * 100 + '%', top: hl.t * 100 + '%', width: hl.w * 100 + '%', height: hl.h * 100 + '%' });
  p.div.append(d);
}
function clearPdfHl() {
  find.pdfHl = null;
  for (const d of els.pdfPages.querySelectorAll('.hl')) d.remove();
}

/* ---------- Remember my place ---------- */
// Positions are small, so they live in localStorage (on this phone only), one entry per document.
const posKey = (id) => 'pos:' + id;
function store(key, val) { try { val === null ? localStorage.removeItem(key) : localStorage.setItem(key, val); } catch {} }
function load(key) { try { return localStorage.getItem(key); } catch { return null; } }
function forgetPos(id) { store(posKey(id), null); }
function savePos() {
  if (!current?.saved) return;
  if (current.kind === 'pdf') {
    if (!pdfPages.length) return;
    const n = currentPage(), p = pdfPages[n - 1];
    const wr = els.pdfWrap.getBoundingClientRect(), pr = p.div.getBoundingClientRect();
    store(posKey(current.id), JSON.stringify({ page: n, frac: Math.max(0, (wr.top - pr.top) / pr.height) }));
  } else if (mode === 'read') {
    const r = els.reader;
    store(posKey(current.id), JSON.stringify({ ratio: r.scrollTop / Math.max(1, r.scrollHeight - r.clientHeight) }));
  }
}
function readPos() { try { return JSON.parse(load(posKey(current.id))) || null; } catch { return null; } }
function restoreTextPos() {
  const pos = readPos();
  if (!pos?.ratio) return;
  const r = els.reader;
  r.scrollTop = pos.ratio * (r.scrollHeight - r.clientHeight);
}
function restorePdfPos() {
  const pos = readPos();
  const p = pos?.page && pdfPages[pos.page - 1];
  if (!p) return;
  const wr = els.pdfWrap.getBoundingClientRect(), pr = p.div.getBoundingClientRect();
  els.pdfWrap.scrollTop += pr.top - wr.top + (pos.frac || 0) * pr.height;
  updatePageLabel();
}
let posTimer;
const savePosSoon = () => { clearTimeout(posTimer); posTimer = setTimeout(savePos, 400); };
els.reader.addEventListener('scroll', savePosSoon, { passive: true });
els.pdfWrap.addEventListener('scroll', savePosSoon, { passive: true });
// Also save when the app goes to the background (the phone may close it there).
// A document that was never saved stays unsaved (it needs a name first); only its position is kept.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'hidden') return;
  savePos();
  if (current?.saved && isDirty()) save();
});

/* ---------- Text size ---------- */
const SIZES = [14, 16, 18, 20, 22, 24, 27, 30, 34];
let fontSize = +load('fontSize') || 18;
function applyFontSize() { document.documentElement.style.setProperty('--doc-font', fontSize + 'px'); }
function changeFont(dir) {
  const r = els.reader, ratio = r.scrollTop / Math.max(1, r.scrollHeight - r.clientHeight);
  const i = SIZES.findIndex((s) => s >= fontSize);
  fontSize = SIZES[Math.min(SIZES.length - 1, Math.max(0, (i < 0 ? 2 : i) + dir))];
  store('fontSize', String(fontSize));
  applyFontSize();
  r.scrollTop = ratio * (r.scrollHeight - r.clientHeight);
  toast('Text size ' + Math.round((fontSize / 18) * 100) + '%');
}
applyFontSize();
$('smallerBtn').onclick = () => changeFont(-1);
$('biggerBtn').onclick = () => changeFont(1);

/* ---------- Keep the screen on while reading ---------- */
// On while a document is open for reading; lets go after 10 minutes without touching or scrolling.
const IDLE_MS = 10 * 60 * 1000;
let wakeLock = null, wakePending = false, lastActive = Date.now();
const wantWake = () => !!current && (current.kind === 'pdf' || mode === 'read') && document.visibilityState === 'visible' && Date.now() - lastActive < IDLE_MS;
async function syncWake() {
  if (!('wakeLock' in navigator)) return;
  if (wantWake()) {
    if (wakeLock || wakePending) return;
    wakePending = true;
    try {
      const w = await navigator.wakeLock.request('screen');
      w.addEventListener('release', () => { if (wakeLock === w) wakeLock = null; });
      wakeLock = w;
      if (!wantWake()) syncWake(); // the document was closed while waiting
    } catch { wakeLock = null; }
    wakePending = false;
  } else if (wakeLock) {
    const w = wakeLock; wakeLock = null;
    w.release().catch(() => {});
  }
}
const activity = () => { lastActive = Date.now(); syncWake(); };
for (const ev of ['pointerdown', 'keydown']) document.addEventListener(ev, activity, { passive: true });
for (const el of [els.reader, els.pdfWrap]) el.addEventListener('scroll', activity, { passive: true });
document.addEventListener('visibilitychange', syncWake);
setInterval(syncWake, 30000);

/* ---------- Share to Pocket Docs ---------- */
// Other apps' "Share" menu sends files here. The offline helper (sw.js) parks them in a small
// "share-inbox" storage and opens the app with ?shared=1; this picks them up.
// Any website can send a file to that address, so each item is imported only after "Add <name>?".
// Cancel leaves it out: the item is already removed from the inbox before the question.
const askAdd = (name) => ask({ title: 'Add ' + name + '?', message: 'This was shared with Pocket Docs.', buttons: [{ label: 'Cancel', value: false }, { label: 'Add', value: true, primary: true }] });
async function receiveShared() {
  if (!new URLSearchParams(location.search).has('shared')) return;
  history.replaceState(null, '', location.pathname);
  let inbox;
  try { inbox = await caches.open('share-inbox'); } catch { return; }
  let last = null;
  for (const req of await inbox.keys()) {
    const res = await inbox.match(req);
    await inbox.delete(req);
    if (!res) continue;
    if (req.url.endsWith('/__shared/text')) {
      const { title = '', text = '', url = '' } = await res.json().catch(() => ({}));
      const body = [text, url && !text.includes(url) ? url : ''].filter(Boolean).join('\n');
      if (!body.trim()) continue;
      const textName = (title || body.split('\n')[0]).slice(0, 60).trim() || 'Shared text';
      if (!(await askAdd(textName))) continue;
      const now = Date.now();
      last = { id: newId(), name: textName, kind: 'text', format: 'txt', text: body, created: now, updated: now, saved: true };
      await dbPut(last);
    } else {
      const name = decodeURIComponent(res.headers.get('X-Name') || 'shared');
      if (!(await askAdd(name))) continue;
      const file = new File([await res.blob()], name, { type: res.headers.get('Content-Type') || '' });
      last = (await importFile(file)) || last;
    }
  }
  await renderList();
  if (last) openDoc(last);
}

/* ---------- Start ---------- */
const APP_VERSION = 9; // keep in step with VERSION in sw.js
$('version').textContent = 'Pocket Docs · version ' + APP_VERSION;
askPersist();
const storageFailed = () => { $('emptyMsg').textContent = 'Storage unavailable'; $('emptyMsg').hidden = false; };
renderList().catch(storageFailed);
receiveShared().catch(() => toast('Storage unavailable'));
if ('serviceWorker' in navigator) {
  // When an update of the app arrives, reload — but only on the document list, so nothing unsaved is lost.
  const hadWorker = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadWorker) return;
    if (!current) location.reload();
    else toast('App updated — it will refresh next time you open it');
  });
  navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Offline setup failed', e));
}
</script>
